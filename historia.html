<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="LogoCecyMagic.jpeg" type="image/jpeg">

    <title>WEBSITE CEcyMagic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        h1 {
            color: #660000;
        }

        h2 {
            color: #333333;
        }

        .card {
            height: 100%;
            border: none;
        }

        .card-title {
            color: #660000;
            font-weight: bold;
        }

        .card-img-top {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .card {
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,.2);
        }

        @media (max-width: 767px) {
            .card-img-top {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->
    <div class="container text-center my-5">

        <h1>Historia</h1>
        <h2>de Valle de Bravo</h2>

    </div>

    <!-- DOS COLUMNAS -->
    <div class="container my-5">

        <div class="row g-4">

            <!-- APARTADO 1 -->
            <div class="col-md-6">

                <div class="card shadow mb-4">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Historia de Valle de Bravo
                        </h5>

                        <img src="H1.jpeg"
                        class="card-img-top mb-3"
                        alt="Historia">

                        <h5 class="card-title">
                            Caracteristicas
                        </h5>

                        <img src="H2.jpeg"
                        class="card-img-top mb-3"
                        alt="Caracteristicas">

                    </div>

                </div>

            </div>

            <!-- APARTADO 2 -->
            <div class="col-md-6">

                <div class="card shadow mb-4">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Atractivos
                        </h5>

                        <img src="H3.jpeg"
                        class="card-img-top mb-3"
                        alt="Atractivos">

                        <h5 class="card-title">
                            Ubicacion
                        </h5>

                        <img src="H4.jpeg"
                        class="card-img-top mb-3"
                        alt="Ubicacion ">

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
    <A HREF="index.html"> Menu</A>
</html>
